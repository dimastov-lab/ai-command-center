name: CI

# Automated quality gates for AI Command Center.
#
# Runs the deterministic local validation commands (whitespace errors, Ruff,
# byte-compile, full pytest with coverage) in a clean, ephemeral environment on
# every pull request into main and on every push to main, plus on-demand via the
# Actions tab.
#
# Design constraints (see README "Continuous integration"):
#   * No secrets are referenced; the suite mocks every real Claude/Codex CLI call
#     and never spends API credits or launches a real agent job.
#   * Least-privilege token: read-only, no GitHub write operations.
#   * The test suite isolates itself from real data via AICC_DATA_DIR / a
#     monkeypatched REPORTS_ROOT (tests/conftest.py); the runner is disposable, so
#     nothing is mutated outside per-test temp fixtures.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs for the same ref (e.g. a new push to an open PR) so only
# the latest commit's gates keep running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the gates only read the checked-out code.
permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality gates (whitespace · Ruff · compile · pytest)
    runs-on: ubuntu-latest
    # A single coverage-enabled pass normally takes ~10 min on a cold runner;
    # keep headroom for runner variance while bounding genuine hangs.
    timeout-minutes: 20
    env:
      AICC_AIOS_SDK_WHEEL: ${{ github.workspace }}/.artifacts/aios_sdk-0.2.0-py3-none-any.whl
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Deliberate failure canary
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-gate-canary-linux')
        run: exit 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-web.txt

      # System libraries the optional PySide6 desktop shell (requirements-
      # desktop.txt) links against at import time. The ubuntu-latest image does
      # not ship libEGL, so without this `pytest-qt`'s `pytest_configure` hook
      # crashes the whole suite with `ImportError: libEGL.so.1` before any test
      # (even non-desktop ones) can run. Cheap (apt), only needed when the
      # desktop deps are installed.
      - name: Install Qt system libraries (for optional desktop shell)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements-web.txt

      - name: Install exact accepted AIOS SDK artifact
        env:
          AIOS_ARTIFACT_READ_TOKEN: ${{ secrets.AIOS_ARTIFACT_READ_TOKEN }}
        run: |
          python scripts/fetch_aios_sdk_artifact.py --output .artifacts
          pip install "$AICC_AIOS_SDK_WHEEL"

      - name: Whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git show --check --format= HEAD
          fi

      - name: Ruff
        run: ruff check .

      - name: Compile validation
        run: python -m compileall -q command_center scripts tests app.py

      # Collect coverage during the required test run instead of executing all
      # tests a second time.  No fail-under threshold is configured, so test
      # failures still gate the job while the coverage percentage remains
      # informational.  Durations make future runtime regressions visible in
      # the CI log without adding another test pass.
      - name: Pytest + coverage
        run: pytest -q --durations=50 --cov=command_center --cov-report=term --cov-report=xml

      # Informational, non-blocking signal. It never fails the job so the merge
      # gate stays focused on the deterministic checks above while surfacing
      # type-check progress for a codebase that is not yet fully typed.

      - name: Type check (informational)
        continue-on-error: true
        run: mypy command_center || true

      # Real-browser lifecycle projection is a release invariant, not an
      # informational signal: a failing user journey must fail this check.
      - name: Real-browser E2E
        run: |
          python -m playwright install chromium
          pytest -q tests/test_e2e_status_projection.py

  # Windows 11 x64 leg of the D1 desktop acceptance gate. Mirrors `quality-gates`
  # but on `windows-latest`, so the `pytest-qt` desktop suite and full repository
  # suite run on the platform contract's first Windows target (`PLATFORM_BEHAVIOR.md`
  # §2). This covers the *automated* half of `AICC-D1-GATE`; the interactive
  # display checklist (exact-width geometry round-trip, visible palette switch)
  # still needs a human on a real Windows 11 x64 machine with a display — see
  # `docs/desktop/WINDOWS_RUNBOOK.md` Part B. Per that runbook and the gate
  # definition, a green run here does NOT by itself close the interactive gate.
  # The automated Windows context is nevertheless release-relevant: after this
  # workflow has appeared green on an exact PR head, branch protection can bind
  # its stable job name without relying on an agent report.
  windows-quality-gates:
    name: Windows quality gates (Ruff · compile · pytest)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # PySide6 headless platform plugin; `tests/desktop/conftest.py` already
      # `setdefault`s this, but set it explicitly so a non-empty value is
      # guaranteed (an empty value would crash Qt, per WINDOWS_RUNBOOK.md §2).
      QT_QPA_PLATFORM: "offscreen"
      AICC_AIOS_SDK_WHEEL: ${{ github.workspace }}/.artifacts/aios_sdk-0.2.0-py3-none-any.whl
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Deliberate failure canary
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-gate-canary-windows')
        run: exit 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-web.txt
            requirements-desktop.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements-web.txt
          pip install -r requirements-desktop.txt

      - name: Install exact accepted AIOS SDK artifact
        env:
          AIOS_ARTIFACT_READ_TOKEN: ${{ secrets.AIOS_ARTIFACT_READ_TOKEN }}
        run: |
          python scripts/fetch_aios_sdk_artifact.py --output .artifacts
          pip install "$env:AICC_AIOS_SDK_WHEEL"

      - name: Ruff
        run: ruff check .

      - name: Compile validation
        run: python -m compileall -q command_center scripts tests app.py

      # The desktop pytest-qt suite is the deterministic Windows-relevant signal
      # for the D1 desktop gate. Kept informational for the merge gate (not
      # required) but mirrors the ubuntu job's coverage so Windows regressions
      # surface early. This is exactly the automated half WINDOWS_RUNBOOK.md
      # Step 2 calls for (ruff · compile · `pytest tests/desktop`).
      - name: Desktop pytest-qt suite
        run: pytest tests/desktop -q

      # Real-browser E2E of the status projection. The full repository `pytest -q` is deliberately
      # NOT run here: ~200 of its non-desktop tests are POSIX-only by design
      # (process-group supervision via waitid(WNOWAIT)) and others hit the
      # Windows console `charmap` codec, so a Windows full-suite run is pure
      # noise plus ~23 min of runtime that risks cancelling the job. The
      # desktop gate signal is the `tests/desktop` suite above.
      - name: Real-browser E2E
        run: |
          python -m playwright install chromium
          pytest -q tests/test_e2e_status_projection.py

  # A deterministic security regression context. Dependency-vulnerability
  # feeds are deliberately excluded because mutable remote advisory state would
  # make a merge gate non-reproducible; those belong in a separately managed
  # alerting control. This gate verifies the workflow policy itself plus the
  # product's fail-closed provenance and report-path containment boundaries.
  security-gates:
    name: Security gates (workflow policy · provenance · path containment)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Deliberate failure canary
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-gate-canary-security')
        run: exit 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pytest>=9.0,<10.0"

      - name: Release gate policy
        run: pytest -q tests/test_release_gate_policy.py

      - name: Focused security regressions
        run: |
          pytest -q \
            tests/test_provenance_gating.py \
            tests/test_report_path_containment.py \
            tests/test_runtime_report_path_containment.py \
            tests/test_codex_safety_boundaries.py

  # Build a real production artefact instead of treating Python byte-compilation
  # as a product build. `npm ci` is locked by web/package-lock.json and the Vite
  # command includes the TypeScript project build before emitting web/dist/.
  build-gates:
    name: Build gates (web production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Deliberate failure canary
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-gate-canary-build')
        run: exit 1

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked web dependencies
        run: npm ci --prefix web

      - name: Web production build
        run: npm run build --prefix web

# UX-1 theme engine: native Streamlit theming (no custom CSS). The colour values
# below are the platform-canonical design tokens from
# command_center/design/tokens.json — the same source command_center/ui/board_style.py
# derives its board palette from — so the app, the board and the web/desktop
# shells all share one palette. tests/test_theme_canon.py asserts these
# stay in sync with tokens.json (mapping: primaryColor/blueColor->accent,
# backgroundColor->bg, secondaryBackgroundColor->surface, textColor->text,
# borderColor->line, greenColor->ok, orangeColor->warn, redColor->crit,
# grayColor->text-2). Both [theme.light] and [theme.dark] are defined so the
# built-in app-settings menu can switch between them; there is no separate Python
# "engine" beyond this file plus command_center/ui/theme.py's st.context.theme helper.

[server]
# The application has NO authentication layer yet performs privileged git/gh and
# subprocess operations, so the console must never be reachable off-host. Pinning
# localhost here makes it the default for EVERY launch path — including a bare
# `streamlit run app.py`, which does not go through scripts/start-ui.sh.
#
# An explicit `--server.address` CLI flag still overrides this value, and this
# file cannot see that it did. It is no longer a supported way to expose the
# console: ADR 0010 (docs/adr/0010-streamlit-console-stays-local.md) records
# that the console stays local and that remote access is the authenticated HTTP
# API's job, and command_center/console_boundary.py refuses to serve any session
# on a non-loopback bind however that bind was chosen.
address = "localhost"

[client]
# Hide Streamlit's own developer toolbar — "Deploy", "Stop", the hamburger
# menu and the accessibility affordance it carries. This is a local desktop
# operator console launched by double-clicking a .command file: none of those
# controls do anything meaningful here, and they read as part of our UI (the
# accessibility glyph in particular was mistaken for one of our own icons).
# "minimal" keeps genuinely necessary notices, such as a rerun prompt.
toolbarMode = "minimal"

[theme]
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "medium"
buttonRadius = "medium"

[theme.light]
primaryColor = "#4C6EF0"
backgroundColor = "#F4F6FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#10151F"
borderColor = "#D7DEE9"
greenColor = "#1FA971"
orangeColor = "#C8811A"
redColor = "#E23D4E"
blueColor = "#4C6EF0"
grayColor = "#515A6B"

[theme.dark]
primaryColor = "#6C8CFF"
backgroundColor = "#0B0E14"
secondaryBackgroundColor = "#121724"
textColor = "#E8ECF4"
borderColor = "#2A3441"
greenColor = "#3DDC97"
orangeColor = "#F5B14C"
redColor = "#FF6B7A"
blueColor = "#6C8CFF"
grayColor = "#A6B0C3"

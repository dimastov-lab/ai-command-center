name: AIOS boundary fitness
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled]
    paths:
      - "app.py"
      - "command_center/**"
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/ci.yml"
      - ".github/workflows/arch-fitness.yml"
  push:
    branches: [main]
    paths:
      - "app.py"
      - "command_center/**"
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/ci.yml"
      - ".github/workflows/arch-fitness.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  boundary-fitness:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    name: Boundary fitness (import ban · anti-engine baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt "pytest>=9.0,<10.0"

      - name: AIOS boundary fitness tests
        run: pytest tests/architecture -q

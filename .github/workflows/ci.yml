name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled]
    paths:
      - "app.py"
      - "command_center/**"
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/arch-fitness.yml"
  push:
    branches: [main]
    paths:
      - "app.py"
      - "command_center/**"
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/arch-fitness.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git show --check --format= HEAD
          fi

      - name: Ruff + compile
        run: |
          ruff check .
          python -m compileall -q command_center scripts tests app.py

      - name: Pytest (required, deterministic)
        run: pytest -q --maxfail=1 --durations=20
  windows-quality-gates:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    name: Windows quality gates
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      QT_QPA_PLATFORM: "offscreen"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-web.txt
            requirements-desktop.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -r requirements-desktop.txt

      - name: Ruff + compile + desktop tests
        run: |
          ruff check .
          python -m compileall -q command_center scripts tests app.py
          pytest -q tests/desktop

  final-gate:
    name: Final merge gate
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') && contains(github.event.pull_request.labels.*.name, 'full-ci')))
    runs-on: ubuntu-latest
    needs:
      - quality-gates
      - windows-quality-gates
    steps:
      - name: Assert required checks
        run: |
          if [[ "${{ needs.quality-gates.result }}" != "success" ]]; then
            echo "quality-gates failed"
            exit 1
          fi
          if [[ "${{ needs.windows-quality-gates.result }}" != "success" ]]; then
            echo "windows-quality-gates failed (or continue-on-error masking)"
            exit 1
          fi
          echo "Final gate passed."
